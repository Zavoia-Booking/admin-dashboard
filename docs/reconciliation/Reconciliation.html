<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zavoia · Seat reconciliation</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    html, body { margin: 0; height: 100%; background: #f0eee9; }
    body { font-family: "Geist", -apple-system, system-ui, sans-serif; }
    #root { height: 100%; }
    .zv-frame {
      position: relative;
      width: 100%;
      height: 100%;
      background: var(--canvas);
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 6px 30px rgba(28,28,26,0.08);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="data.js"></script>
  <script type="text/babel" src="ui-shared.jsx"></script>
  <script type="text/babel" src="ui-appts.jsx"></script>
  <script type="text/babel" src="drawer.jsx"></script>
  <script type="text/babel" src="variant-split.jsx"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>

  <script type="text/babel" data-presets="env,react">
    const { useState, useEffect } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "lang": "en",
      "totalMembers": 9,
      "paidSeats": 5
    }/*EDITMODE-END*/;

    function App() {
      const [tw, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const t = window.ZVI18n.makeT(tw.lang);

      const aw = 1320, ah = 880;

      return (
        <>
          <window.DesignCanvas>
            <window.DCSection
              id="reconciliation"
              title="Seat reconciliation"
              subtitle={`A Pro account drops from ${tw.totalMembers} members to ${tw.paidSeats} paid seats. Decide who to remove, then handle their upcoming appointments.`}
            >
              <window.DCArtboard
                id="split"
                label={'Split view \u00b7 Master\u2013detail, everything on one screen'}
                width={aw}
                height={ah}
              >
                <div className="zv-frame zv">
                  <window.ZVSplitView.SplitView
                    t={t} lang={tw.lang}
                    paid={tw.paidSeats}
                    total={tw.totalMembers}
                  />
                </div>
              </window.DCArtboard>
            </window.DCSection>
          </window.DesignCanvas>

          {/* Tweaks panel */}
          <window.TweaksPanel title="Tweaks">
            <window.TweakSection title="Plan">
              <window.TweakSlider label="Total team members" value={tw.totalMembers} min={3} max={12} step={1}
                                  onChange={v => {
                                    setTweak('totalMembers', v);
                                    if (tw.paidSeats > v) setTweak('paidSeats', v);
                                  }} />
              <window.TweakSlider label="Paid seats" value={tw.paidSeats} min={1} max={tw.totalMembers} step={1}
                                  onChange={v => setTweak('paidSeats', v)} />
              <div style={{ fontSize: 11.5, color: '#888', marginTop: -6 }}>
                {tw.totalMembers - tw.paidSeats > 0
                  ? `Over by ${tw.totalMembers - tw.paidSeats} member${tw.totalMembers - tw.paidSeats === 1 ? '' : 's'}`
                  : 'No reconciliation needed'}
              </div>
            </window.TweakSection>

            <window.TweakSection title="Display">
              <window.TweakRadio label="Language" value={tw.lang}
                                 options={[{ value: 'en', label: 'EN' }, { value: 'ro', label: 'RO' }]}
                                 onChange={v => setTweak('lang', v)} />
            </window.TweakSection>
          </window.TweaksPanel>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
