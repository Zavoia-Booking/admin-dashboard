name: iOS TestFlight (prod)

# Signed Release build of the production app (com.zavoia.admin, App Store
# Connect app 6834814344), uploaded to TestFlight. From there it is submitted
# for App Store review in App Store Connect.
# Required secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY,
# IOS_DIST_CERT_P12, IOS_DIST_CERT_PASSWORD, ENV_MOBILE_PROD,
# IOS_GOOGLE_SERVICE_INFO_PLIST_PROD.

# Manual only, from main: Actions tab > "iOS TestFlight (prod)" > Run workflow,
# or `gh workflow run ios-testflight-prod.yml -r main`.
on:
  workflow_dispatch:

concurrency:
  group: ios-testflight-prod
  cancel-in-progress: false

jobs:
  build:
    # Store builds come from released code only.
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Write env and Firebase config from secrets
        env:
          ENV_FILE: ${{ secrets.ENV_MOBILE_PROD }}
          GOOGLE_SERVICE_INFO: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_PROD }}
        run: |
          if [ -z "$ENV_FILE" ]; then echo "::error::ENV_MOBILE_PROD secret is not set"; exit 1; fi
          if [ -z "$GOOGLE_SERVICE_INFO" ]; then echo "::error::IOS_GOOGLE_SERVICE_INFO_PLIST_PROD secret is not set"; exit 1; fi
          printf '%s\n' "$ENV_FILE" > .env.mobile-prod
          printf '%s\n' "$GOOGLE_SERVICE_INFO" > ios/App/App/GoogleService-Info.plist
          plutil -lint ios/App/App/GoogleService-Info.plist

      - name: Build web app and sync to iOS
        run: yarn ios:prod

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ios/App/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('ios/App/CapApp-SPM/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Write distribution certificate
        env:
          CERT_B64: ${{ secrets.IOS_DIST_CERT_P12 }}
        run: |
          if [ -z "$CERT_B64" ]; then echo "::error::IOS_DIST_CERT_P12 secret is not set"; exit 1; fi
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/dist.p12"

      - name: Resolve Swift packages
        # Done up front so fastlane's build-settings probe does not wait on a
        # cold package resolution and time out.
        working-directory: ios/App
        run: xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App -clonedSourcePackagesDirPath SourcePackages

      - name: Build and upload to TestFlight
        working-directory: ios/App
        env:
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "3"
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          IOS_DIST_CERT_P12_PATH: ${{ runner.temp }}/dist.p12
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
        run: |
          xcodebuild -version
          fastlane --version
          fastlane ios prod

      - name: Upload IPA and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-prod-build
          path: |
            ios/App/build/*.ipa
            ios/App/build/*.dSYM.zip
            ~/Library/Logs/gym/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove temporary keychain
        if: always()
        run: security delete-keychain zavoia-ci.keychain-db || true
