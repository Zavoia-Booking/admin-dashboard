name: iOS simulator build

# Signing-free compile check for the Capacitor iOS project. Builds the web app
# in staging-native mode, syncs it into ios/, and compiles for the iOS
# simulator with code signing disabled. No Apple credentials are needed.

on:
  push:
    branches: [ios-build, staging]
    paths:
      - 'ios/**'
      - 'src/**'
      - 'package.json'
      - 'yarn.lock'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - '.github/workflows/ios-simulator-build.yml'
  workflow_dispatch:

concurrency:
  group: ios-sim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-26 ships Xcode 26, which Capacitor 8 requires.
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Write staging env file and Firebase config
        # Both secrets are optional here: Vite tolerates a missing env file, and
        # a placeholder GoogleService-Info.plist is enough for the compile check
        # (the file is a required build input since it is in the Resources phase).
        env:
          ENV_FILE: ${{ secrets.ENV_STAGING_NATIVE }}
          GOOGLE_SERVICE_INFO: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_STAGING }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            printf '%s\n' "$ENV_FILE" > .env.staging-native
            echo "Wrote .env.staging-native from secret"
          else
            echo "ENV_STAGING_NATIVE secret not set; building without env file"
          fi
          if [ -n "$GOOGLE_SERVICE_INFO" ]; then
            printf '%s\n' "$GOOGLE_SERVICE_INFO" > ios/App/App/GoogleService-Info.plist
            echo "Wrote GoogleService-Info.plist from secret"
          else
            echo "IOS_GOOGLE_SERVICE_INFO_PLIST_STAGING not set; writing placeholder plist"
            printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
              '<plist version="1.0"><dict><key>PLACEHOLDER</key><true/></dict></plist>' \
              > ios/App/App/GoogleService-Info.plist
          fi
          plutil -lint ios/App/App/GoogleService-Info.plist

      - name: Build web app and sync to iOS
        run: yarn ios:staging

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ios/App/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('ios/App/CapApp-SPM/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true

      - name: Compile for iOS simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/App/DerivedData \
            -clonedSourcePackagesDirPath ios/App/SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 7
