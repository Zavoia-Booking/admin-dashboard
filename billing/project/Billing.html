<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Billing & Subscription — Inno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* Surfaces — clean white app, light gray section bg */
    --bg: #FFFFFF;
    --bg-page: #FAFAFA;
    --bg-elev: #FFFFFF;
    --bg-sunk: #F5F5F5;
    --bg-soft-accent: #FFF6F2;     /* orange tint */
    --bg-soft-blue:   #F1F4FA;     /* light blue-purple cards seen in marketplace */

    /* Lines */
    --line: #ECECEC;
    --line-soft: #F1F1F1;
    --line-strong: #DDDDDD;

    /* Ink */
    --ink: #111111;
    --ink-1: #2B2B2B;
    --ink-2: #6B6B6B;
    --ink-3: #9A9A9A;
    --ink-4: #C4C4C4;

    /* Brand */
    --accent: #F97316;             /* primary orange */
    --accent-hover: #EA6A12;
    --accent-soft: #FFEEDF;
    --accent-deep: #C44A0E;

    /* Semantic — soft pastel pills like the rest of the app */
    --good: #16A34A;
    --good-soft: #E7F5EC;
    --good-pill-bg: #E6F4EA;
    --good-pill-fg: #1F7A3A;

    --warn: #D97706;
    --warn-soft: #FEF3E2;

    --danger: #DC2626;
    --danger-soft: #FEEAE8;
    --danger-pill-bg: #FDEAE6;
    --danger-pill-fg: #C2412C;

    --info: #4B6CB7;
    --info-soft: #EEF2FB;

    --customized: #B85AAB;         /* the 'Customized' purple-pink dot */
    --customized-soft: #F8EAF5;

    /* Radii — match real app: cards 12-14px, pills fully rounded, inputs ~10px */
    --radius: 12px;
    --radius-sm: 10px;
    --radius-lg: 14px;
    --radius-pill: 999px;

    /* Shadows — very soft, real app uses almost nothing */
    --shadow-card: 0 1px 2px rgba(0,0,0,.03);
    --shadow-pop:  0 8px 24px -8px rgba(0,0,0,.10);

    --font-sans: 'Inter', ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    font-feature-settings: "cv11", "ss01";
  }
  button, input, select, textarea { font-family: inherit; }

  /* density */
  .density-compact { --pad-card: 14px 16px; --pad-row: 10px; --gap-card: 10px; --fs-base: 13px; }
  .density-regular { --pad-card: 18px 20px; --pad-row: 14px; --gap-card: 16px; --fs-base: 14px; }
  .density-comfy   { --pad-card: 24px 26px; --pad-row: 18px; --gap-card: 22px; --fs-base: 14.5px; }
  body { font-size: var(--fs-base, 14px); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: rgba(0,0,0,.10); border-radius: 6px; border: 2px solid var(--bg); background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,.18); border: 2px solid var(--bg); background-clip: content-box; }
</style>
</head>
<body>
  <div id="root"></div>

  <script type="application/json" id="tweak-defaults"></script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="src/icons.jsx"></script>
  <script type="text/babel" src="src/primitives.jsx"></script>
  <script type="text/babel" src="src/shell.jsx"></script>
  <script type="text/babel" src="src/subscription.jsx"></script>
  <script type="text/babel" src="src/sidecards.jsx"></script>
  <script type="text/babel" src="src/billing-form.jsx"></script>
  <script type="text/babel" src="src/mobile.jsx"></script>
  <script type="text/babel" src="src/app.jsx"></script>
</body>
</html>
