<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Billing & Subscription — Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF9F7;
    --bg-elev: #FFFFFF;
    --bg-sunk: #F4F2EE;
    --bg-tint: #F7F4F0;
    --line: #ECE7DF;
    --line-strong: #DCD5C8;
    --ink: #1A1714;
    --ink-1: #3A342B;
    --ink-2: #6B6357;
    --ink-3: #9A8F7F;
    --ink-4: #C4BAA9;

    --accent: #D9572B;       /* refined orange — single brand color */
    --accent-soft: #FBEDE3;
    --accent-deep: #B33F18;

    --good: #2F7A4D;
    --good-soft: #E5F0E9;
    --warn: #B5851A;
    --warn-soft: #FBF1D8;
    --danger: #B0331E;
    --danger-soft: #F8E0DA;
    --info: #3A6491;
    --info-soft: #E4ECF5;

    --radius: 12px;
    --radius-sm: 8px;
    --radius-lg: 18px;

    --shadow-sm: 0 1px 0 rgba(20,16,10,.04), 0 1px 2px rgba(20,16,10,.04);
    --shadow-md: 0 1px 0 rgba(20,16,10,.04), 0 4px 16px -4px rgba(20,16,10,.08);

    --font-sans: 'Geist', ui-sans-serif, system-ui, -apple-system, sans-serif;
    --font-mono: 'Geist Mono', ui-monospace, monospace;
    --font-serif: 'Instrument Serif', Georgia, serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    font-feature-settings: "ss01", "cv11";
  }
  button { font-family: inherit; }
  /* density */
  .density-compact { --pad-card: 16px; --pad-row: 10px; --gap-card: 12px; --fs-base: 13px; }
  .density-regular { --pad-card: 22px; --pad-row: 14px; --gap-card: 16px; --fs-base: 14px; }
  .density-comfy   { --pad-card: 28px; --pad-row: 18px; --gap-card: 22px; --fs-base: 15px; }
  body { font-size: var(--fs-base, 14px); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: rgba(0,0,0,.12); border-radius: 6px; border: 2px solid var(--bg); background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,.22); border: 2px solid var(--bg); background-clip: content-box; }
</style>
</head>
<body>
  <div id="root"></div>

  <script type="application/json" id="tweak-defaults">
  </script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="src/icons.jsx"></script>
  <script type="text/babel" src="src/primitives.jsx"></script>
  <script type="text/babel" src="src/shell.jsx"></script>
  <script type="text/babel" src="src/subscription.jsx"></script>
  <script type="text/babel" src="src/sidecards.jsx"></script>
  <script type="text/babel" src="src/billing-form.jsx"></script>
  <script type="text/babel" src="src/mobile.jsx"></script>
  <script type="text/babel" src="src/app.jsx"></script>
</body>
</html>
